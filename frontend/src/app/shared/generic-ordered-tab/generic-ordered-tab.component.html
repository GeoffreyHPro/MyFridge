<div class="card">
    <p-table [value]="items">
        <ng-template pTemplate="header">
            <tr>
                @for (header of itemHeaders; track $index) {
                <th pSortableColumn="{{header}}">
                    <div class="flex items-center gap-2">
                        {{header | uppercase }}
                        <p-sortIcon field="{{header}}" />
                    </div>
                </th>
                }
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">

            <tr>
                @for (header of itemHeaders; track $index) {

                <td>
                    {{ item[header] }}
                </td>

                }

                <td>
                    <button pButton type="button" icon="pi pi-pencil" (click)="editItem()">
                    </button>
                </td>

                <td>
                    <button pButton type="button" icon="pi pi-trash" (click)="deleteItem(id, item)">
                    </button>
                </td>
            </tr>

        </ng-template>


        <ng-template pTemplate="footer">
            <tr>
                @for (total of totalItems; track $index) {
                <td>{{ total }}</td>
                }
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmDialog></p-confirmDialog>
